<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart College Complaint System | OCT</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notif-card {
            background: white;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .notif-card.unread {
            background: #eff6ff;
            border-left-color: #2563eb;
        }
        .notif-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }
        .notif-message {
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-word;
        }
        .notif-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <div>
                    <span class="brand-logo-text">Oriental College of Technology</span>
                    <span class="brand-subtitle">Smart College Complaint Management System</span>
                </div>
            </div>
            <div class="nav-actions">
                <span class="user-badge" id="userHeaderBadge">👤 Loading...</span>
                <button id="singleBackBtn" class="btn btn-back">
                    &larr; Back to Dashboard
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container" style="max-width: 760px;">
        <div class="top-box">
            <div class="top-box-header">
                <div>
                    <h1 style="color:var(--primary-dark); font-size:1.6rem;">🔔 Grievance Notifications</h1>
                    <p style="color:var(--text-muted); font-size:0.95rem;">
                        Real-time alerts regarding status updates, assignments, and authority comments.
                    </p>
                </div>
                <div class="top-box-actions">
                    <button id="markAllReadBtn" class="btn btn-outline btn-sm">
                        ✓ Mark All as Read
                    </button>
                </div>
            </div>
        </div>

        <div id="notificationsContainer">
            <div class="spinner-box">
                <div class="spinner"></div>
                <p>Loading notifications...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { 
            db, 
            collection, 
            query, 
            where, 
            onSnapshot, 
            doc, 
            updateDoc, 
            getDocs 
        } from "./js/firebase-config.js";

        import { requireAuth } from "./js/auth.js";
        import { escapeHTML, formatDateTime, showToast } from "./js/utils.js";

        // Route Guard: Require any authenticated user
        const authData = (await requireAuth()) || {};
        const { user = {}, profile = {} } = authData;

        const role = (profile && profile.role) || "student";
        const name = (profile && profile.name) || user.email;

        document.getElementById("userHeaderBadge").textContent = `${role === 'student' ? '👨‍🎓' : '🏛️'} ${name} (${role})`;

        // Single Back button: dynamically points to the user's correct dashboard
        const singleBackBtn = document.getElementById("singleBackBtn");
        singleBackBtn.addEventListener("click", () => {
            if (role === "Admin") {
                window.location.href = "admin-dashboard.html";
            } else if (role === "student") {
                window.location.href = "dashboard.html";
            } else {
                window.location.href = "authority-dashboard.html";
            }
        });

        // Notifications Realtime Subscription
        const notificationsContainer = document.getElementById("notificationsContainer");
        const markAllReadBtn = document.getElementById("markAllReadBtn");

        let currentNotifications = [];

        // Build query based on role:
        // Students receive notifications where toUid == user.uid
        // Authorities receive notifications where toUid == user.uid OR toRole == role
        const notifCol = collection(db, "notifications");

        // Listen for user's direct UID notifications
        onSnapshot(notifCol, (snapshot) => {
            currentNotifications = [];
            snapshot.forEach((d) => {
                const data = d.data();
                // Filter client side to handle either toUid or toRole safely
                if (data.toUid === user.uid || (role !== "student" && data.toRole === role)) {
                    currentNotifications.push({
                        firestoreId: d.id,
                        ...data
                    });
                }
            });

            // IMPORTANT: Never mutate array with reverse()! Use a safe sort copy.
            currentNotifications.sort((a, b) => {
                const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (new Date(a.createdAt || 0)).getTime();
                const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (new Date(b.createdAt || 0)).getTime();
                return timeB - timeA;
            });

            renderNotifications();
        }, (err) => {
            console.error("Notifications listener error:", err);
            notificationsContainer.innerHTML = `
                <div class="empty-state">
                    <p style="color:var(--danger);">Error syncing notifications: ${escapeHTML(err.message)}</p>
                </div>
            `;
        });

        function renderNotifications() {
            if (currentNotifications.length === 0) {
                notificationsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔔</div>
                        <h3>No Notifications</h3>
                        <p style="margin-top:6px;">You are completely caught up! New grievance alerts will appear here in real time.</p>
                    </div>
                `;
                markAllReadBtn.disabled = true;
                return;
            }

            markAllReadBtn.disabled = !currentNotifications.some((n) => !n.read);
            notificationsContainer.innerHTML = "";

            currentNotifications.forEach((n) => {
                const card = document.createElement("div");
                card.className = `notif-card ${n.read ? "" : "unread"}`;

                card.innerHTML = `
                    <div style="flex:1;">
                        <div class="notif-title">
                            ${n.read ? "⚪" : "🔵"} ${escapeHTML(n.title || "Notification")}
                        </div>
                        <div class="notif-message">${escapeHTML(n.message || "")}</div>
                        <div class="notif-time">${escapeHTML(formatDateTime(n.createdAt))}</div>
                    </div>
                    <div>
                        ${!n.read ? `
                            <button class="btn btn-outline btn-sm mark-read-btn" data-docid="${n.firestoreId}">
                                Mark as Read
                            </button>
                        ` : `
                            <span style="font-size:0.75rem; color:var(--text-muted);">Read</span>
                        `}
                    </div>
                `;

                notificationsContainer.appendChild(card);
            });

            // Mark single as read
            document.querySelectorAll(".mark-read-btn").forEach((btn) => {
                btn.addEventListener("click", async () => {
                    const docId = btn.getAttribute("data-docid");
                    try {
                        await updateDoc(doc(db, "notifications", docId), {
                            read: true
                        });
                        showToast("Notification marked as read.", "info");
                    } catch (err) {
                        showToast("Failed to update notification: " + err.message, "error");
                    }
                });
            });
        }

        // Mark All as Read
        markAllReadBtn.addEventListener("click", async () => {
            const unread = currentNotifications.filter((n) => !n.read);
            if (unread.length === 0) return;

            markAllReadBtn.disabled = true;
            markAllReadBtn.textContent = "Marking...";

            try {
                for (const item of unread) {
                    await updateDoc(doc(db, "notifications", item.firestoreId), {
                        read: true
                    });
                }
                showToast("All notifications marked as read.", "success");
            } catch (err) {
                showToast("Failed to mark all as read: " + err.message, "error");
            } finally {
                markAllReadBtn.textContent = "✓ Mark All as Read";
            }
        });
    </script>
</body>
</html>
